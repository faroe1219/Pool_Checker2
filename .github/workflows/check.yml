name: Pool Schedule Checker

on:
  schedule:
    # 毎日 日本時間 朝7:00 (UTC 22:00) に自動実行する設定
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動でもテスト実行できるようにするボタン

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install tools
        run: |
          pip install requests beautifulsoup4 pypdf google-genai

      - name: Run python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
